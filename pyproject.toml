[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptrampart"
version = "0.1.0"
description = "A security testing harness for Large Language Models. Runs curated attack prompts against LLM endpoints and produces a security report card."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Md Motasaddik Azmine" }]
keywords = ["llm", "security", "prompt-injection", "jailbreak", "red-team", "owasp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
promptrampart = "promptrampart.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptrampart = ["packs/*.yaml", "templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
